name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extension
        run: python -m pip install .
      - name: Test Python API
        run: python -m unittest discover -s tests -v
      - name: Test native allocation balance
        run: |
          c++ -std=c++11 -Wall -Wextra -Iinclude tests/test_memory.cpp -o /tmp/test-memory
          /tmp/test-memory
      - name: Test with AddressSanitizer, LeakSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          c++ -std=c++11 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/test_memory.cpp -o /tmp/test-memory-asan
          /tmp/test-memory-asan
